[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astribot-draw-sdk"
version = "0.1.0"
description = "T1 drawing trajectory sessions for mock, SDK simulation and hardware"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22,<3"]

[project.scripts]
astribot-draw = "astribot_draw_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
